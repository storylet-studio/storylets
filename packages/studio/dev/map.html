<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Map lab</title>
    <!-- theme.css is imported from map.ts: a ../ link escapes the dev root. -->
    <link rel="stylesheet" href="./lab.css" />
  </head>
  <body>
    <div id="lab">
      <header class="bar">
        <strong>Map lab</strong>
        <span class="sep"></span>
        <button id="addzone">Add zone</button>
        <button id="addpin">Pin a hand</button>
        <button id="bg">Add background</button>
        <button id="bglock">Add locked background</button>
        <!-- No camera buttons: fit / fit-selection / zoom are the surface's own
             cluster in the canvas corner, and the lab has to show what the app
             shows or it stops being evidence about the app. -->
        <output id="zoom">100%</output>
        <span class="sep"></span>
        <select id="theme" aria-label="Theme">
          <option value="">Follow the system</option>
          <option value="linen">Linen</option>
          <option value="baize">Baize</option>
        </select>
      </header>
      <div id="stage" class="nodestage"></div>
      <footer class="log">
        <output id="sel">nothing selected</output>
        <output id="hover">no hover</output>
        <output id="events"></output>
      </footer>
    </div>
    <script type="module" src="./map.ts"></script>
  </body>
</html>
