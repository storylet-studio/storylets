<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board map lab</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #lab { height: 100%; display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #8884; }
      .bar strong { font-size: 0.9rem; }
      /* The Board's own two-column shape: the map takes the big column. */
      .body { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
      #stage { min-height: 0; }
      .side { border-left: 1px solid #8884; padding: 12px; font-size: 0.85rem; }
      .events { padding: 6px 12px; border-top: 1px solid #8884; font-family: ui-monospace, monospace; font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <div id="lab">
      <header class="bar">
        <strong>Board map lab</strong>
        <button id="play">Play from the pin</button>
        <button id="reset">Reset the run</button>
        <select id="theme" aria-label="Theme">
          <option value="">Follow the system</option>
          <option value="linen">Linen</option>
          <option value="baize">Baize</option>
        </select>
      </header>
      <div class="body">
        <div id="stage"></div>
        <div class="side" id="side">nothing selected</div>
      </div>
      <div class="events" id="events">ready</div>
    </div>
    <script type="module" src="/board.ts"></script>
  </body>
</html>
