name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storylets
        uses: actions/checkout@v5
        with:
          path: storylets
      # tsconfig + vitest alias @wildwinter/expr to a sibling ../expr checkout (dev tests
      # against its source, not the published version). Mirror that here so CI sees the same.
      - name: Checkout @wildwinter/expr (sibling source)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storylets/package-lock.json
      - run: npm ci
        working-directory: storylets
      - run: npm run typecheck
      # The backstop for the pre-push hook, which is local-only and skippable with
      # --no-verify. A published package whose source moves with no changeset keeps its
      # version while its build changes, so the registry would serve one build under a
      # version number the repo has given to another.
      - name: Every published package that moved has a changeset
        working-directory: storylets
        run: node scripts/release-guard.mjs "${{ github.event.before }}" "${{ github.sha }}"
        if: github.event_name == 'push'
        working-directory: storylets
      - run: npm test
        working-directory: storylets
      # The four runtimes' API surface. This script existed since the flows work
      # and its own header said "a member missing anywhere fails CI" - while
      # nothing ran it anywhere. Found by the pre-release audit, 2026-08-29.
      - run: npm run parity
        working-directory: storylets
      # The Village client is a SAMPLE, so it has a second kind of rot: it can
      # compile, pass and play while quietly teaching two thirds of an API that
      # grew underneath it. This asks whether it still shows what there is to
      # show (design/village-client.md section 6).
      - run: npm run sample
        working-directory: storylets
      - run: npm run build
        working-directory: storylets
      # The playable-HTML export inlines a MINIFIED COPY of the runtime, generated
      # into packages/ops/src/playable-player.ts by ops' prebuild. If that copy
      # drifts from the current runtime, a published page ships a stale engine.
      # Nothing checked it here until 2026-09-01, and it went stale that day: the
      # truthiness alignment changed the runtime, and the blob only regenerated
      # because a local build happened to run. Patterplay has had this guard since
      # its own blob silently missed a change; this is the matching half.
      - name: Generated player blob is up to date
        working-directory: storylets
        run: |
          if ! git diff --quiet -- packages/ops/src/playable-player.ts; then
            echo "::error::packages/ops/src/playable-player.ts is stale - run 'npm run gen-player-blob -w @storylet-studio/ops' and commit the result."
            git diff --stat -- packages/ops/src/playable-player.ts
            exit 1
          fi
