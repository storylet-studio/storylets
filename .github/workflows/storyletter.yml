name: Storyletter release

# The desktop app's own tag-driven pipeline, Patterpad's shape verbatim
# (patter/.github/workflows/patterpad.yml): tagging `vX.Y.Z` builds + signs
# Storyletter on each OS and publishes the installers plus the electron-updater
# feeds (latest-mac.yml / latest.yml / latest-linux.yml) to the matching Release.
#
# STORYLETTER IS THE ONE DELIVERABLE ON BARE `v*` TAGS, and that is load-bearing
# rather than tidiness. electron-builder's GitHub publisher can only target a
# `v<version>` tag, and electron-updater walks the releases feed skipping any tag
# that is not plain semver - so `cli-v*` releases are invisible to it, which is
# exactly what we want. Never give another deliverable a bare `v*` tag: a
# non-Storyletter release taking GitHub's "Latest" badge has no latest.yml, and
# Check for Updates then 404s. (Patterpad learned this the hard way.)
on:
  push:
    # `v[0-9]*`, NOT `v*`. The loose glob matches any tag beginning with v, which
    # includes `village-v0.1.0` - and it fired on exactly that, stripped the leading
    # v to get "illage-v0.1.0", and only stopped because the changelog check found no
    # section by that name. One guard away from creating a draft Storyletter release
    # off another deliverable's tag. Anchoring on a digit is what "bare v* tags are
    # Storyletter's alone" actually requires.
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  # Pre-create the release as a DRAFT with the changelog section as its notes; the OS
  # matrix uploads installers into it BY ITS ID, and `publish` flips it live once every
  # OS has uploaded. The draft is a staging area so a half-built release is never visible.
  #
  # By id, not by tag: electron-builder finds a draft by listing the releases, and on
  # 0.26.0 (2026-10-22) that list didn't show the notes draft for minutes. Linux and
  # Windows each made a draft of their own, the files split across two, and publish made
  # the empty notes draft live. So electron-builder only builds (--publish never) and the
  # upload step below puts the files on the draft this job made.
  #
  # A tag with a hyphen (v0.26.1-rehearsal.1) is a REHEARSAL: everything runs, the files
  # land on the draft, and publish is skipped, so it never goes live or takes "Latest".
  # Delete the draft, the tag and its branch afterwards.
  notes:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: storylets
      - name: Checkout @wildwinter/expr (sibling source, aliased by tsconfig)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storylets/package-lock.json
      - run: npm ci
        working-directory: storylets
      # The suite gates the release, in the job that runs FIRST and that every OS
      # build waits on, so a failure stops it before a draft exists rather than
      # after three installers have been signed.
      #
      # ci.yml covers push and pull_request, so the code is tested somewhere. What
      # that cannot promise is that the commit being TAGGED is one that passed:
      # until this, "the commit I tagged is the commit I tested" was a claim about
      # what somebody remembered. Raised from the Patter side, who found a worse
      # version of it in their npm publish.
      #
      # Order is typecheck then test, matching ci.yml. Their warning about
      # tests-first silently disabling a gate that skips without a build artifact
      # was checked here and does not apply: nothing in this suite conditions on
      # `dist/` existing, and ci.yml has always run test before build.
      - run: npm run typecheck
        working-directory: storylets
      - run: npm test
        working-directory: storylets
      - name: Create the draft release with the changelog as notes
        id: draft
        working-directory: storylets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" 'index($0, "## [" ver "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            packages/studio/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "no changelog section for ${version}"; exit 1; }
          # A rerun of this job reuses a draft it can see for the tag; failing that it makes one.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Storyletter $version" -F draft=true \
              -F prerelease=$([[ "$version" == *-* ]] && echo true || echo false) \
              -F body=@"$RUNNER_TEMP/release-notes.md" --jq .id)
          fi
          echo "draft release $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout storylets
        uses: actions/checkout@v5
        with:
          path: storylets
      # electron-vite bundles @wildwinter/expr from a sibling checkout, as CI does.
      - name: Checkout @wildwinter/expr
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storylets/package-lock.json
      - run: npm ci
        working-directory: storylets
      - name: Check the tag matches the app version
        working-directory: storylets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./packages/studio/package.json').version")
          [ "$manifest" = "$version" ] || { echo "package.json says $manifest but the tag says $version"; exit 1; }
          grep -q "^## \[${version}\] - [0-9]" packages/studio/CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated ${version} section"; exit 1; }
      # Apple's Developer ID G2 intermediate. A Developer ID certificate issued since Apple moved to its
      # G2 authority chains through it (the one made in October 2026, valid to 2031, does), and a runner
      # image need not carry it: without it codesign cannot build the chain back to Apple's root, as
      # a Mac without it calls the certificate "not trusted". Pinned by fingerprint, so a changed
      # download stops the build here rather than signing against something unexpected. Into the
      # System keychain, because codesign searches it whoever made the signing keychain.
      - name: Install Apple's Developer ID G2 intermediate (macOS only)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/DeveloperIDG2CA.cer
          fp=$(openssl x509 -inform DER -in /tmp/DeveloperIDG2CA.cer -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$fp" = "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" ] || { echo "unexpected Developer ID G2 certificate (SHA-256 $fp)"; exit 1; }
          if security find-certificate -a -Z -c "Developer ID Certification Authority" /Library/Keychains/System.keychain | grep -q "F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"; then
            echo "Developer ID G2 intermediate already installed"
          else
            sudo security add-certificates -k /Library/Keychains/System.keychain /tmp/DeveloperIDG2CA.cer
          fi
          rm /tmp/DeveloperIDG2CA.cer
      - name: Build and sign
        working-directory: storylets
        run: npm run -w @storylet-studio/studio ${{ matrix.script }} -- --publish never
        env:
          # macOS signing + notarisation, SCOPED TO THE MAC JOB ONLY. These are not
          # no-ops elsewhere: on Windows electron-builder reads CSC_LINK as an
          # Authenticode certificate and then writes that publisher into
          # app-update.yml as the expected one, so every Windows auto-update fails
          # verification. Unsigned with no publisherName skips the check and updates
          # work. Windows stays deliberately unsigned (Patterpad's ruling, and its
          # reasoning, inherited whole).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      # Each installer, its blockmap and the updater feed, onto the notes job's draft by id.
      # Spaces become dashes, as electron-builder names them on GitHub and as latest*.yml
      # refers to them. An asset already there (a rerun) is replaced.
      - name: Upload to the draft release
        working-directory: storylets/packages/studio/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          shopt -s nullglob
          files=( *.dmg *.zip *.exe *.AppImage *.blockmap latest*.yml )
          [ ${#files[@]} -gt 0 ] || { echo "nothing to upload"; exit 1; }
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')
          for f in "${files[@]}"; do
            [[ "$f" == *__uninstaller* ]] && continue
            name="${f// /-}"
            old=$(awk -v n="$name" '$2 == n {print $1}' <<< "$existing")
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq '"uploaded \(.name) \(.size)"'
          done

  # Every OS uploaded -> publish. Runs only when the whole matrix succeeded, so a
  # partial release never goes live, and refuses a draft missing any of the ten files
  # (three latest*.yml feeds among them). A rehearsal tag (with a hyphen) stops before it.
  publish:
    needs: [notes, build]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')
          echo "$names"
          for want in latest-mac.yml latest.yml latest-linux.yml; do
            grep -qx "$want" <<< "$names" || { echo "the draft has no $want"; exit 1; }
          done
          [ "$(wc -l <<< "$names")" -eq 10 ] || { echo "the draft has $(wc -l <<< "$names") files, not 10"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '"published \(.html_url)"'
