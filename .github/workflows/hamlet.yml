name: The Hamlet release

# Tagging `hamlet-vX.Y.Z` builds the Hamlet and attaches FIVE zips to the matching GitHub
# Release. One is the plain Hamlet, Storyletter's first example: its project and the
# playable page Storyletter exports from it, with no Patter anywhere. The other four are the
# Hamlet (Patter Version), the game that runs both engines: the web client (`dist/` to play,
# `src/` to read, `projects/` with both source projects, paired) and the Godot, Unity and
# Unreal projects to open in their editors.
#
# The Village's arrangement, cloned, with one difference that matters: this one runs TWO
# engines. Everything of Patter's comes from a PUBLISHED release, never a checkout of
# ../patter: the browser file and the three engine plugins are fetched by version, and
# `@patterkit/runtime` from npm for the fixture writer. There is no second repository to
# check out here.
#
# The build's own cross-checks (scripts/pairing.mjs) run as part of `npm run build`, so a
# card with no scene, or a branch that never says which outcome it reached, fails the
# release before it fails a player.
#
# Its own family, versioned independently, like the Village.
on:
  push:
    tags: ["hamlet-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storylets
        uses: actions/checkout@v5
        with:
          path: storylets
      - name: Checkout @wildwinter/expr (the client bundles the runtime, which inlines it)
        uses: actions/checkout@v5
        with:
          repository: wildwinter/expr
          path: expr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storylets/package-lock.json
      - run: npm ci
        working-directory: storylets

      - name: Check the tag matches the client version
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          manifest=$(node -p "require('./packages/hamlet-client/package.json').version")
          [ "$manifest" = "$version" ] || { echo "package.json says $manifest but the tag says $version"; exit 1; }
          grep -q "^## \[${version}\] - [0-9]" packages/hamlet-client/CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated ${version} section"; exit 1; }

      - name: Verify it still plays (the gated scripted playthroughs)
        working-directory: storylets
        run: npx vitest run packages/hamlet-client

      # The client copies in the browser drop-in that @storylet-studio/play-helpers builds,
      # so the libraries are built EXPLICITLY here. The test step above happens to build
      # them too, but a release should not rest on a side effect of its own gate.
      - name: Build the libraries the client copies from
        working-directory: storylets
        run: npm run build:libs

      - name: Build the client
        working-directory: storylets
        run: npm run build -w @storylet-studio/hamlet-client

      - name: Assemble the plain Hamlet's zip (its project, and the page Storyletter exports)
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          pkg="the-hamlet-${version}"
          out="/tmp/${pkg}"
          mkdir -p "$out"
          # Committed files only (git archive), never a local build's leftovers.
          git archive --format=tar HEAD examples/the-hamlet.storylets | tar -x -C "$out" --strip-components=1
          # The CLI is built by build:libs above; this is Publish Playable HTML, from the terminal.
          node packages/cli/dist/cli.js export-html examples/the-hamlet.storylets -o "$out/The Hamlet.html"
          cp packages/hamlet-client/plain/README.md LICENSE "$out/"
          ( cd /tmp && zip -rq "${pkg}.zip" "${pkg}" )
          echo "HAMLET_PLAIN_ZIP=/tmp/${pkg}.zip" >> "$GITHUB_ENV"

      - name: Assemble the Patter Version's web zip
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          pkg="the-hamlet-patter-${version}"
          out="/tmp/${pkg}"
          mkdir -p "$out"
          # dist/ to play, src/ to read, and the two files that explain both. The
          # index.html at the top only forwards into dist/, so whichever one a
          # player double-clicks, the game opens (the page's own template, copied
          # here until 0.3.x, was a frame with no script beside it).
          cp -R packages/hamlet-client/dist "$out/dist"
          cp -R packages/hamlet-client/src "$out/src"
          cp packages/hamlet-client/README.md packages/hamlet-client/CHANGELOG.md "$out/"
          # projects/: both source projects, paired and side by side as the repo keeps
          # them, with their published bundles, so the storylet project opens in
          # Storyletter and the Patter one in Patterpad with nothing to set up.
          # Committed files only (git archive), never a local build's leftovers.
          mkdir -p "$out/projects"
          git archive --format=tar HEAD examples/the-hamlet-patter.storylets examples/the-hamlet.patter \
            examples/storylet-dist/the-hamlet-patter.storyletsc examples/patter-dist/the_hamlet.patterc \
            | tar -x -C "$out/projects" --strip-components=1
          printf '%s\n' '<!doctype html>' '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=dist/index.html">' \
            '<title>The Hamlet (Patter Version)</title>' '<p><a href="dist/index.html">Play The Hamlet (Patter Version)</a></p>' > "$out/index.html"
          cp LICENSE "$out/"
          ( cd /tmp && zip -rq "${pkg}.zip" "${pkg}" )
          echo "HAMLET_ZIP=/tmp/${pkg}.zip" >> "$GITHUB_ENV"

      - name: Assemble the Godot project zip (open it in Godot 4.7+ and press Play)
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          bash ports/godot/HamletDemo/build.sh
          pkg="the-hamlet-patter-godot-${version}"
          rm -rf "/tmp/${pkg}"; mkdir -p "/tmp/${pkg}"
          # The project as it opens: source, both addons, both bundles. Not .godot/, not the save.
          ( cd ports/godot/HamletDemo && tar --exclude=.godot --exclude=envelope.json -cf - . ) | ( cd "/tmp/${pkg}" && tar -xf - )
          cp LICENSE "/tmp/${pkg}/"
          ( cd /tmp && zip -rq "${pkg}.zip" "${pkg}" )
          echo "HAMLET_GODOT_ZIP=/tmp/${pkg}.zip" >> "$GITHUB_ENV"

      - name: Assemble the Unity project zip (open it in Unity 6000.4+ and press Play)
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          bash ports/unity/HamletDemo/build.sh
          pkg="the-hamlet-patter-unity-${version}"
          rm -rf "/tmp/${pkg}"; mkdir -p "/tmp/${pkg}"
          # The project as it opens: source, Patter's embedded package, both bundles; and OUR
          # package copied beside it, since the manifest's file: reference expects a sibling.
          ( cd ports/unity/HamletDemo && tar --exclude=Library --exclude=Logs --exclude=Temp --exclude=UserSettings --exclude=obj --exclude='TestHost/bin' --exclude='TestHost/obj' -cf - . ) | ( cd "/tmp/${pkg}" && tar -xf - )
          mkdir -p "/tmp/${pkg}-sibling"; cp -R ports/unity/StoryletEngine "/tmp/${pkg}-sibling/StoryletEngine"
          cp LICENSE "/tmp/${pkg}/"
          ( cd /tmp && zip -rq "${pkg}.zip" "${pkg}" "${pkg}-sibling" )
          echo "HAMLET_UNITY_ZIP=/tmp/${pkg}.zip" >> "$GITHUB_ENV"

      - name: Assemble the Unreal project zip (open the .uproject in Unreal 5.7+, let it build, press Play)
        working-directory: storylets
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          bash ports/unreal/HamletDemo/build.sh
          pkg="the-hamlet-patter-unreal-${version}"
          rm -rf "/tmp/${pkg}"; mkdir -p "/tmp/${pkg}"
          # Three siblings, as the .uproject expects: the project, our plugin, Patter's plugin.
          ( cd ports/unreal/HamletDemo && tar --exclude=Binaries --exclude=Intermediate --exclude=Saved --exclude=DerivedDataCache -cf - . ) | ( mkdir -p "/tmp/${pkg}/HamletDemo" && cd "/tmp/${pkg}/HamletDemo" && tar -xf - )
          cp -R ports/unreal/StoryletEngine "/tmp/${pkg}/StoryletEngine"
          cp -R ports/unreal/Patterplay "/tmp/${pkg}/Patterplay"
          # The saves the web client wrote, which the project's automation test loads (Tests/fixtures).
          mkdir -p "/tmp/${pkg}/HamletDemo/Tests/fixtures"
          cp ports/godot/HamletDemo/test/fixtures/envelope-from-js*.json "/tmp/${pkg}/HamletDemo/Tests/fixtures/"
          cp LICENSE "/tmp/${pkg}/"
          ( cd /tmp && zip -rq "${pkg}.zip" "${pkg}" )
          echo "HAMLET_UNREAL_ZIP=/tmp/${pkg}.zip" >> "$GITHUB_ENV"

      - name: Release notes = this version's changelog section
        id: relnotes
        run: |
          version="${GITHUB_REF_NAME#hamlet-v}"
          awk -v ver="$version" 'index($0, "## [" ver "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            storylets/packages/hamlet-client/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "no changelog section for ${version}"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false  # never claim GitHub's Latest badge - that stays on Storyletter for the updater
          name: The Hamlet ${{ steps.relnotes.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ env.HAMLET_PLAIN_ZIP }}
            ${{ env.HAMLET_ZIP }}
            ${{ env.HAMLET_GODOT_ZIP }}
            ${{ env.HAMLET_UNITY_ZIP }}
            ${{ env.HAMLET_UNREAL_ZIP }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
